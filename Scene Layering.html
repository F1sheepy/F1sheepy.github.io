<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>轮腿式无人智能搭载平台 — 场景分层与运行设计条件（ODD）</title>
<style>
:root{
  /* ---- 深色科技风：底 / 面 / 线 ---- */
  --bg:#05080c; --surface:#0a1018; --surface2:#0d1520; --surface3:#0b131d;
  --line:rgba(140,180,210,.13); --line2:rgba(140,180,210,.28);
  --glass:rgba(255,255,255,.02); --glass2:rgba(255,255,255,.05);
  /* ---- 文字层级 ---- */
  --txt:#dbe6f0; --dim:#7b8ea3; --faint:#4d5d6d; --lead:#b9c9d8;
  /* ---- 强调色 ---- */
  --cy:#22d3ee; --mint:#4ade80; --amber:#fbbf24; --orange:#fb923c; --red:#f87171;
  --violet:#a78bfa; --steel:#94a3b8;
  /* ---- 判定语义（屏幕：深底亮字） ---- */
  --ok-bg:rgba(74,222,128,.13); --ok-fg:#86efac;
  --lim-bg:rgba(251,191,36,.13); --lim-fg:#fcd34d;
  --no-bg:rgba(248,113,113,.15); --no-fg:#fca5a5;
  --mix-bg:rgba(148,163,184,.13); --mix-fg:#cbd5e1;
  --na-bg:rgba(148,163,184,.055); --na-fg:#54636f;
  --sans:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);font-size:13.5px;line-height:1.7;color:var(--txt);background:var(--bg);
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--cy);text-decoration:none}
a:hover{text-decoration:none}
h1,h2,h3,h4{margin:0;font-weight:750;color:var(--txt)}
code,.mono{font-family:var(--mono)}
::selection{background:rgba(34,211,238,.28);color:#fff}

/* ---------- 背景装饰 ---------- */
.bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(120,170,200,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(120,170,200,.045) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 30%,transparent 85%);
  -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 30%,transparent 85%)}
.bg-glow{position:fixed;top:-360px;left:50%;transform:translateX(-50%);width:1100px;height:720px;
  z-index:0;pointer-events:none;filter:blur(20px);
  background:radial-gradient(circle,rgba(34,211,238,.10) 0%,rgba(34,211,238,.03) 40%,transparent 70%)}

/* ---------- header ---------- */
.hd{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:11px clamp(16px,3vw,30px);background:rgba(5,8,12,.82);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
.hd-l{display:flex;flex-direction:column;line-height:1.3;min-width:240px;
  border-left:2px solid var(--cy);padding-left:12px}
.hd-t{font-size:15px;font-weight:750;letter-spacing:.02em;color:#eaf4ff}
.hd-s{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.14em;margin-top:3px}
.hd-srch{position:relative;flex:1 1 320px;min-width:240px;max-width:520px}
.hd-srch input{width:100%;padding:7px 13px;border-radius:7px;border:1px solid var(--line2);
  background:var(--glass);color:var(--txt);font-size:12.5px;font-family:inherit;outline:none;transition:.2s}
.hd-srch input::placeholder{color:var(--faint)}
.hd-srch input:focus{border-color:rgba(34,211,238,.55);background:rgba(34,211,238,.05);
  box-shadow:0 0 0 3px rgba(34,211,238,.10)}
.qres{position:absolute;top:40px;left:0;right:0;background:var(--surface2);border-radius:11px;
  box-shadow:0 16px 44px rgba(0,0,0,.7);max-height:420px;overflow:auto;border:1px solid var(--line2)}
.qres.hidden{display:none}
.qg{padding:7px 13px 3px;font-family:var(--mono);font-size:10.5px;color:var(--faint);
  letter-spacing:.14em;background:var(--surface3);border-bottom:1px solid var(--line)}
.qi{padding:7px 13px;cursor:pointer;border-bottom:1px solid rgba(140,180,210,.07);transition:.15s}
.qi:last-child{border-bottom:0}
.qi:hover,.qi.on{background:rgba(34,211,238,.08)}
.qi .qit{display:flex;gap:10px;align-items:baseline}
.qi b{font-size:12px;color:var(--cy);font-family:var(--mono);min-width:56px;font-weight:700}
.qi span{font-size:12.5px;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qi .qis{font-size:11.5px;color:var(--dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qnone{padding:14px;color:var(--dim);font-size:12.5px;text-align:center}
.hd-nav{display:flex;gap:4px;flex-wrap:wrap}
.hd-nav a{color:var(--dim);font-size:12.5px;padding:6px 12px;border-radius:7px;white-space:nowrap;transition:.2s}
.hd-nav a:hover{color:var(--cy);background:rgba(34,211,238,.07)}
.hd-nav a.on{color:var(--cy);background:rgba(34,211,238,.11);
  box-shadow:inset 0 0 0 1px rgba(34,211,238,.3);font-weight:700}

/* ---------- layout ---------- */
main{position:relative;z-index:1;padding:26px clamp(16px,3vw,30px) 64px;max-width:1580px;margin:0 auto}
.page-h{margin-bottom:20px}
.page-h::before{content:"";display:block;width:38px;height:1px;background:var(--cy);opacity:.75;margin-bottom:14px}
.page-h h1{font-size:clamp(21px,2.4vw,27px);letter-spacing:-.01em;color:#eaf4ff;font-weight:800;line-height:1.3}
.page-h p{margin:8px 0 0;color:var(--dim);font-size:12.5px;max-width:960px;line-height:1.8}
.ft{margin-top:44px;padding:18px clamp(16px,3vw,30px);border-top:1px solid var(--line);color:var(--faint);
  font-size:11.5px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
  font-family:var(--mono);letter-spacing:.04em}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:13px;margin-bottom:16px;
  overflow:hidden;position:relative;transition:.25s}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;
  background:linear-gradient(90deg,var(--cy),transparent 68%);opacity:.5;pointer-events:none}
.card>h2{font-size:14px;padding:13px 17px 12px;background:none;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;color:var(--txt);font-weight:750;line-height:1.5}
.card>h2 .num{display:inline-flex;width:22px;height:22px;border-radius:6px;flex:0 0 auto;
  background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.32);color:var(--cy);
  font-family:var(--mono);font-size:11.5px;align-items:center;justify-content:center;font-weight:700}
.card>h2 .sub{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--faint);
  letter-spacing:.12em;font-weight:400;white-space:nowrap}
.card-b{padding:15px 17px}
.lead{color:var(--dim);font-size:12.5px;margin:0 0 14px;line-height:1.8}

.badge{display:inline-flex;align-items:center;padding:1px 9px;border-radius:5px;font-size:11.5px;
  font-weight:700;white-space:nowrap;border:1px solid transparent;line-height:1.65}
.b-ok{background:var(--ok-bg);color:var(--ok-fg);border-color:color-mix(in srgb,var(--ok-fg) 28%,transparent)}
.b-lim{background:var(--lim-bg);color:var(--lim-fg);border-color:color-mix(in srgb,var(--lim-fg) 28%,transparent)}
.b-no{background:var(--no-bg);color:var(--no-fg);border-color:color-mix(in srgb,var(--no-fg) 28%,transparent)}
.b-mix{background:var(--mix-bg);color:var(--mix-fg);border-color:color-mix(in srgb,var(--mix-fg) 28%,transparent)}
.b-lv1{background:rgba(96,165,250,.14);color:#93c5fd;border-color:rgba(147,197,253,.3)}
.b-lv2{background:var(--lim-bg);color:var(--lim-fg);border-color:color-mix(in srgb,var(--lim-fg) 28%,transparent)}
.b-lv3{background:var(--no-bg);color:var(--no-fg);border-color:color-mix(in srgb,var(--no-fg) 28%,transparent)}

.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:20px;font-size:11.5px;
  border:1px solid color-mix(in srgb,var(--c,var(--steel)) 34%,transparent);
  background:color-mix(in srgb,var(--c,var(--steel)) 9%,transparent);
  color:var(--c,var(--steel));margin:0 5px 5px 0;font-family:var(--mono);transition:.18s;line-height:1.7}
a.chip:hover{border-color:rgba(34,211,238,.6);color:var(--cy);background:rgba(34,211,238,.09);
  box-shadow:0 0 14px -6px rgba(34,211,238,.8)}
.chip.r-极高{--c:var(--red)}
.chip.r-高{--c:var(--orange)}
.chip.r-中{--c:var(--cy)}
.chip.r-低{--c:var(--mint)}

.kv{display:grid;grid-template-columns:122px 1fr;gap:0;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.kv dt{padding:9px 13px;background:var(--glass);font-weight:700;color:var(--dim);font-size:11.5px;
  border-bottom:1px solid var(--line);border-right:1px solid var(--line);
  font-family:var(--mono);letter-spacing:.05em}
.kv dd{padding:9px 13px;margin:0;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--lead)}
.kv dt:nth-last-of-type(1),.kv dd:nth-last-of-type(1){border-bottom:0}

.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:11px;background:var(--surface)}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
table.tbl th,table.tbl td{padding:8px 11px;border-bottom:1px solid rgba(140,180,210,.08);text-align:left;vertical-align:top}
table.tbl thead th{background:var(--surface3);color:var(--cy);font-weight:700;font-size:10.5px;
  font-family:var(--mono);letter-spacing:.1em;
  position:sticky;top:0;z-index:2;border-bottom:1px solid var(--line2);white-space:nowrap}
table.tbl th:first-child,table.tbl td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;
  border-right:1px solid var(--line)}
table.tbl thead th:first-child{background:var(--surface3);z-index:3}
table.tbl tbody tr:nth-child(even) td{background:var(--glass)}
table.tbl tbody tr:nth-child(even) td:first-child{background:#0b1119}
table.tbl tbody tr:hover td{background:rgba(34,211,238,.05)}
table.tbl tbody tr:hover td:first-child{background:#0c151f}
table.tbl tbody tr:last-child td{border-bottom:0}
td.idc,th.idc{font-family:var(--mono);font-weight:700;color:var(--cy);white-space:nowrap;font-size:12px}
td.tc{color:var(--lead)}
td.c{text-align:center}
tr.hl td{background:rgba(34,211,238,.11)!important}
tr.hl td:first-child{background:rgba(34,211,238,.15)!important;box-shadow:inset 3px 0 0 var(--cy)}

/* ---------- V1 全景 ---------- */
.l1grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:14px}
.l1card{background:var(--surface);border:1px solid var(--line);border-radius:13px;overflow:hidden;
  display:flex;flex-direction:column;position:relative;transition:.25s}
.l1card:hover{border-color:var(--line2);transform:translateY(-2px)}
.l1card::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;
  background:linear-gradient(90deg,var(--cy),transparent 70%);opacity:.55;pointer-events:none}
.l1hd{padding:11px 15px 10px;background:linear-gradient(180deg,rgba(34,211,238,.055),transparent);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.l1hd .lid{font-family:var(--mono);font-size:11px;background:rgba(34,211,238,.13);color:var(--cy);
  border:1px solid rgba(34,211,238,.3);padding:1px 7px;border-radius:5px;font-weight:700}
.l1hd h3{color:var(--txt);font-size:13.5px;flex:1;line-height:1.4;font-weight:750}
.l1hd .cnt{font-family:var(--mono);font-size:10.5px;color:var(--faint);white-space:nowrap;letter-spacing:.06em}
.rbar{display:flex;height:4px;background:rgba(255,255,255,.045)}
.rbar i{display:block;height:100%;opacity:.95}
.l1body{padding:11px 13px;display:flex;flex-direction:column;gap:9px;flex:1}
.l2blk{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--glass);transition:.2s}
.l2blk:hover{border-color:var(--line2);background:var(--surface2)}
.l2hd{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.l2hd .id2{font-family:var(--mono);font-size:10.5px;color:var(--cy);background:rgba(34,211,238,.11);
  border:1px solid rgba(34,211,238,.24);padding:0 6px;border-radius:5px;font-weight:700}
.l2hd .nm2{font-size:12.5px;font-weight:750;color:var(--txt)}
.l2hd .n2{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:0}
.chip .ttl{font-family:var(--sans);font-size:11px;color:inherit;opacity:.86;max-width:172px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- V2 场景详情 ---------- */
.crumb{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-bottom:12px;letter-spacing:.06em}
.crumb a{color:var(--dim)}
.crumb a:hover{color:var(--cy)}
.shero{background:linear-gradient(135deg,rgba(34,211,238,.075),var(--surface) 58%);
  border:1px solid var(--line);border-left:3px solid var(--cy);border-radius:13px;
  padding:18px 20px;margin-bottom:16px;box-shadow:0 16px 40px -28px rgba(34,211,238,.55)}
.shero .row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:7px}
.shero h1{font-size:19px;line-height:1.45;color:#eaf4ff;font-weight:800}
.shero .sid{font-family:var(--mono);font-size:12.5px;background:rgba(34,211,238,.13);color:var(--cy);
  border:1px solid rgba(34,211,238,.3);padding:1px 9px;border-radius:5px;font-weight:700}
.shero .meta{font-size:12px;color:var(--faint);font-family:var(--mono)}
.shero .meta b{color:var(--dim);font-weight:700}

/* ---------- V3 ODD ---------- */
.oddwrap{display:grid;grid-template-columns:296px 1fr;gap:16px;align-items:start}
.oddtree{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  position:sticky;top:78px;max-height:calc(100vh - 100px);overflow-y:auto}
.treehd{padding:10px 14px;background:rgba(34,211,238,.055);font-family:var(--mono);color:var(--cy);
  font-size:10.5px;letter-spacing:.14em;border-bottom:1px solid var(--line);font-weight:700}
.oddtree details>summary{list-style:none;cursor:pointer;padding:8px 12px;font-size:12.5px;font-weight:750;
  color:var(--txt);display:flex;gap:8px;align-items:center;border-bottom:1px solid rgba(140,180,210,.07);
  transition:.15s}
.oddtree details>summary:hover{background:rgba(34,211,238,.05)}
.oddtree details>summary::-webkit-details-marker{display:none}
.oddtree details>summary::before{content:"▸";font-size:9px;color:var(--cy);opacity:.7;transition:transform .15s}
.oddtree details[open]>summary::before{content:"▾"}
.oddtree summary .n{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--faint);font-weight:400}
.d3list{padding:3px 0 5px}
.d3i{padding:5px 12px 5px 30px;font-size:12px;color:var(--dim);cursor:pointer;display:flex;gap:8px;transition:.15s}
.d3i:hover{background:rgba(34,211,238,.06);color:var(--txt)}
.d3i.on{background:rgba(34,211,238,.12);color:var(--cy);font-weight:700;box-shadow:inset 2px 0 0 var(--cy)}
.d3i .n{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.oddmain{min-width:0}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px;align-items:center}
.fb{padding:3px 12px;border-radius:20px;border:1px solid var(--line2);background:var(--glass);
  font-size:12px;cursor:pointer;color:var(--dim);font-family:inherit;transition:.18s}
.fb:hover{border-color:rgba(34,211,238,.5);color:var(--cy);background:rgba(34,211,238,.06)}
.fb.on{background:var(--cy);color:#05080c;border-color:var(--cy);font-weight:700;
  box-shadow:0 0 18px -6px rgba(34,211,238,.85)}
.fb.on.f-ok{background:var(--mint);border-color:var(--mint);color:#05241a;box-shadow:0 0 18px -6px rgba(74,222,128,.85)}
.fb.on.f-lim{background:var(--amber);border-color:var(--amber);color:#2a1d02;box-shadow:0 0 18px -6px rgba(251,191,36,.85)}
.fb.on.f-no{background:var(--red);border-color:var(--red);color:#2c0a0a;box-shadow:0 0 18px -6px rgba(248,113,113,.85)}
.fb.on.f-mix{background:var(--steel);border-color:var(--steel);color:#0a1119;box-shadow:0 0 18px -6px rgba(148,163,184,.85)}
.olist{display:flex;flex-direction:column;gap:11px}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:11px;overflow:hidden;transition:.22s}
.ocard:hover{border-color:var(--line2);background:var(--surface2)}
.ocard.sel{border-color:rgba(34,211,238,.55);
  box-shadow:0 0 0 1px rgba(34,211,238,.18),0 14px 36px -20px rgba(34,211,238,.85)}
.ochd{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--glass);
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.ochd .oid{font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--cy)}
.ochd .onm{font-size:13px;font-weight:750;color:var(--txt)}
.ochd .od3{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.06em}
.obd{padding:12px 14px;display:grid;grid-template-columns:90px 1fr;gap:6px 12px;font-size:12.5px}
.obd dt{color:var(--faint);font-weight:700;font-size:10.5px;padding-top:3px;font-family:var(--mono);letter-spacing:.06em}
.obd dd{margin:0;color:var(--lead)}
.axis{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.axseg{font-size:11px;padding:2px 8px;border-radius:5px;line-height:1.6;
  border:1px solid color-mix(in srgb,currentColor 26%,transparent)}
.ax-ok{background:var(--ok-bg);color:var(--ok-fg)}
.ax-lim{background:var(--lim-bg);color:var(--lim-fg)}
.ax-no{background:var(--no-bg);color:var(--no-fg)}
.reflist{display:flex;flex-wrap:wrap;gap:0;margin-top:7px}

/* ---------- V4 矩阵 ---------- */
.mtx{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;background:var(--surface)}
.mtx th,.mtx td{border-bottom:1px solid rgba(140,180,210,.07);border-right:1px solid rgba(140,180,210,.055);
  padding:0;text-align:center}
.mtx thead th{background:var(--surface3);color:var(--cy);font-weight:700;font-size:10.5px;
  font-family:var(--mono);letter-spacing:.05em;padding:9px 4px;position:sticky;top:0;z-index:2;
  line-height:1.35;height:52px;vertical-align:middle;border-bottom:1px solid var(--line2)}
.mtx thead th.stk{text-align:left;padding-left:13px;z-index:4;background:var(--surface3);color:var(--cy)}
.mtx tbody th.stk{position:sticky;left:0;background:var(--surface);text-align:left;padding:6px 11px;z-index:1;
  font-weight:700;color:var(--txt);font-size:12px;white-space:nowrap;border-right:1px solid var(--line)}
.mtx tbody th.stk .id2{font-family:var(--mono);font-size:10px;color:var(--faint);display:block;
  font-weight:400;margin-top:1px}
.mtx tbody tr:nth-child(even) th.stk{background:#0b1119}
.mtx tbody tr:hover th.stk{background:#0c151f}
.mtx td.mc{font-size:16px;font-weight:700;height:34px;cursor:pointer;transition:.15s}
.mtx td.mc:hover{outline:2px solid var(--cy);outline-offset:-2px;filter:brightness(1.35)}
.mc-allow{background:rgba(74,222,128,.12);color:#86efac}
.mc-lim{background:rgba(251,191,36,.12);color:#fcd34d}
.mc-no{background:rgba(248,113,113,.15);color:#fca5a5}
.mc-na{background:var(--na-bg);color:var(--na-fg)}
.mtx tr.mtxstat th,.mtx tr.mtxstat td{background:var(--surface3);font-size:10.5px;padding:7px 4px;
  color:var(--dim);border-top:1px solid var(--line2);font-family:var(--mono)}
.mtx tr.mtxstat th.stk{position:sticky;left:0;background:var(--surface3);text-align:left;
  padding-left:13px;z-index:4;color:var(--cy);letter-spacing:.08em}
.mtxwrap{overflow:auto;border:1px solid var(--line);border-radius:13px;max-height:none;background:var(--surface);
  box-shadow:0 20px 50px -40px rgba(34,211,238,.6)}

<script>
(function(){
"use strict";
var D = window.DATA;
var M = D.meta;

/* ========== 索引 ========== */
var SC={},EL={},ODD={},ST={},HM={},RP={};
D.scenarios.forEach(function(x){SC[x.id]=x});
D.elements.forEach(function(x){EL[x.id]=x});
D.odd_items.forEach(function(x){ODD[x.id]=x});
D.states.forEach(function(x){ST[x.id]=x});
D.humans.forEach(function(x){HM[x.id]=x});
D.responses.forEach(function(x){RP[x.id]=x});

var RISK2B = {'极高':'b-no','高':'b-lim','中':'b-mix','低':'b-ok'};
var VD2B   = {'允许':'b-ok','限制':'b-lim','禁止':'b-no','混合':'b-mix'};
var VD2AX  = {'允许':'ax-ok','限制':'ax-lim','禁止':'ax-no'};
var LV2B   = {'I':'b-lv1','II':'b-lv2','III':'b-lv3'};

function h(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function by(f){return function(a,b){return String(a[f]).localeCompare(String(b[f]),'zh')};}
function grp(list,key){
  var m={},o=[];
  list.forEach(function(x){var k=x[key];if(!m[k]){m[k]=[];o.push(k);}m[k].push(x);});
  return o.map(function(k){return {key:k,items:m[k]};});
}

/* ========== 术语 tooltip（数据来自 00 表 glossary） ========== */
var TERMS=[];
(function(){
  (D.glossary||[]).forEach(function(g){
    var zh=String(g.term==null?'':g.term).replace(/[A-Za-z][A-Za-z\s\/\-·]*/g,'').trim();
    if(zh.length>=4) TERMS.push({w:zh,d:g.def||''});
  });
  TERMS.sort(function(a,b){return b.w.length-a.w.length;});
})();
var TERM_SKIP={TD:1,TH:1,A:1,SCRIPT:1,STYLE:1,H1:1,H2:1,H3:1,BUTTON:1,INPUT:1,CODE:1,B:1,I:1};
/* 在正文首次出现处标注术语，悬停显示 00 表定义；每词最多 2 处，跳过表格与树 */
function markTerms(root){
  if(!TERMS.length||!root) return;
  var used={},nodes=[],w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null,false),n;
  while((n=w.nextNode())) nodes.push(n);
  nodes.forEach(function(node){
    var p=node.parentNode;
    if(!p||TERM_SKIP[p.tagName]) return;
    if(p.closest&&p.closest('.tbl-wrap,.qres,.oddtree,.term')) return;
    var txt=node.nodeValue;
    if(!txt||txt.length<4) return;
    var out='',i=0,changed=false;
    while(i<txt.length){
      var hit=null;
      for(var k=0;k<TERMS.length;k++){
        var t=TERMS[k];
        if((used[t.w]||0)>=2) continue;
        if(txt.substr(i,t.w.length)===t.w){hit=t;break;}
      }
      if(hit){
        used[hit.w]=(used[hit.w]||0)+1;
        out+='<span class="term" data-d="'+h(hit.d)+'">'+h(hit.w)+'</span>';
        i+=hit.w.length;changed=true;
      }else{out+=h(txt.charAt(i));i++;}
    }
    if(changed){
      var sp=document.createElement('span');
      sp.innerHTML=out;
      if(node.parentNode) node.parentNode.replaceChild(sp,node);
    }
  });
}
function vd(v){return '<span class="badge '+(VD2B[v]||'b-mix')+'">'+h(v||'—')+'</span>';}
function lv(v){return '<span class="badge '+(LV2B[v]||'b-mix')+'">等级 '+h(v)+'</span>';}
function risk(v){return '<span class="badge '+(RISK2B[v]||'b-mix')+'">风险 '+h(v)+'</span>';}
function scLink(id,opt){
  var s=SC[id];if(!s)return h(id);
  opt=opt||{};
  var cls='chip r-'+(s.risk||'中');
  var t=opt.full?h(id)+' '+h(s.title):h(id);
  return '<a class="chip '+cls+'" href="#/scenario/'+id+'" title="'+h(id+' '+s.title)+'">'+t+
    (opt.title?' <span class="ttl">'+h(s.title)+'</span>':'')+'</a>';
}
function oddLink(id){
  var o=ODD[id];if(!o)return '<span class="chip">'+h(id)+'</span>';
  return '<a class="chip" href="#/odd/'+id+'" title="'+h(o.d3+' · '+o.name)+'">'+h(id)+' '+h(o.name)+'</a>';
}
function rpLink(id){
  var r=RP[id];if(!r)return '<span class="chip">'+h(id)+'</span>';
  return '<a class="chip" href="#/degrade/'+id+'" title="'+h(r.category+' · '+r.monitor)+'">'+h(id)+' '+h(r.monitor)+'</a>';
}

/* 阈值轴：把 setting 里的 允许/限制/禁止 分段染色 */
function axis(setting){
  if(!setting) return '';
  var segs=String(setting).split(/[；;]/).filter(function(x){return x.trim()});
  var out=[],n=0;
  segs.forEach(function(s){
    var cls=null;
    if(/禁止/.test(s))cls='no';
    else if(/限制/.test(s))cls='lim';
    else if(/允许/.test(s))cls='ok';
    if(!cls)return;
    n++;out.push('<span class="axseg ax-'+cls+'">'+h(s.trim())+'</span>');
  });
  if(n<2) return '';
  return '<div class="axis">'+out.join('')+'</div>';
}

/* ========== V1 场景全景 ========== */
function viewHome(){
  var l1map={},l2map={};
  D.scenarios.forEach(function(s){
    (l1map[s.l1_id]=l1map[s.l1_id]||[]).push(s);
    (l2map[s.l2_id]=l2map[s.l2_id]||[]).push(s);
  });
  var html='<div class="page-h"><h1>场景分层全景（L1 → L2 → L3）</h1>'+
    '<p>'+h(M.short_title)+' 按作战任务（L1，'+D.l1.length+' 类）→ 任务剖面（L2，'+D.l2.length+' 类）→ 具体场景（L3，'+D.scenarios.length+' 条）三级分解。'+
    '点击任意 S-xx 进入场景详情枢纽页；场景卡片颜色表示风险等级。</p></div>';

  html+='<div class="statrow">'+
    '<div class="stat"><div class="sv">'+D.scenarios.length+'</div><div class="sl">L3 场景</div></div>'+
    '<div class="stat"><div class="sv">'+D.l2.length+'</div><div class="sl">L2 任务剖面</div></div>'+
    '<div class="stat"><div class="sv">'+D.l1.length+'</div><div class="sl">L1 任务场景</div></div>'+
    '<div class="stat"><div class="sv">'+D.elements.length+'</div><div class="sl">场景要素 E-xxx</div></div>'+
    '<div class="stat"><div class="sv">'+D.odd_items.length+'</div><div class="sl">ODD 条目 4-xxx</div></div>'+
    '<div class="stat"><div class="sv">'+D.responses.length+'</div><div class="sl">越界响应 8-xxx</div></div>'+
    '<div class="stat"><div class="sv">'+D.states.length+' / '+D.humans.length+'</div><div class="sl">系统状态 / 人员状态</div></div>'+
    '</div>';

  html+='<div class="l1grid">';
  D.l1.forEach(function(L1){
    var scs=l1map[L1.id]||[];
    var l2s=D.l2.filter(function(x){return x.l1_id===L1.id});
    var cnt={};scs.forEach(function(s){cnt[s.risk]=(cnt[s.risk]||0)+1});
    var order=['极高','高','中','低'];
    var bar=order.filter(function(k){return cnt[k]}).map(function(k){
      var w=(cnt[k]/scs.length*100).toFixed(1);
      var c={'极高':'#8C1F1F','高':'#C9A227','中':'#2E5C46','低':'#5C8A4A'}[k];
      return '<i style="width:'+w+'%;background:'+c+'" title="'+k+' '+cnt[k]+' 条"></i>';
    }).join('');
    html+='<section class="l1card"><div class="l1hd"><span class="lid">'+h(L1.id)+'</span><h3>'+h(L1.name)+'</h3>'+
      '<span class="cnt">'+l2s.length+' 类 L2 · '+scs.length+' 条 L3</span></div>'+
      '<div class="rbar">'+bar+'</div><div class="l1body">';
    l2s.forEach(function(L2){
      var ss=l2map[L2.id]||[];
      html+='<div class="l2blk"><div class="l2hd"><span class="id2">'+h(L2.id)+'</span>'+
        '<span class="nm2">'+h(L2.name)+'</span><span class="n2">'+ss.length+' 条</span></div><div class="chips">';
      ss.forEach(function(s){
        html+='<a class="chip r-'+(s.risk||'中')+'" href="#/scenario/'+s.id+'" title="'+h(s.summary)+'">'+
          h(s.id)+'<span class="ttl">'+h(s.title)+'</span></a>';
      });
      html+='</div></div>';
    });
    html+='</div></section>';
  });
  html+='</div>';

  /* 分级框架表 */
  html+='<div class="card" style="margin-top:20px"><h2>场景五级分解框架（01 表）</h2><div class="card-b"><div class="tbl-wrap"><table class="tbl">'+
    '<thead><tr><th class="idc">级别</th><th>名称</th><th>定义</th><th>本文件规模</th><th>用途</th><th>示例</th></tr></thead><tbody>';
  D.layers.forEach(function(x){
    html+='<tr><td class="idc">'+h(x.level)+'</td><td>'+h(x.name)+'</td><td class="tc">'+h(x.definition)+'</td>'+
      '<td class="tc">'+h(x.scale)+'</td><td class="tc">'+h(x.use)+'</td><td class="tc">'+h(x.example)+'</td></tr>';
  });
  html+='</tbody></table></div></div></div>';
  return html;
}

/* ========== V2 场景详情 ========== */
function viewScenario(id,hl){
  var s=SC[id];
  if(!s) return '<div class="empty">未找到场景 <b>'+h(id)+'</b>。<a href="#/">返回全景</a></div>';
  var els=s.element_ids.map(function(e){return EL[e]}).filter(Boolean);
  var odds=s.odd_refs.map(function(o){return ODD[o]}).filter(Boolean);
  var rps=(s.response_ids||[]).map(function(r){return RP[r]}).filter(Boolean);

  var html='<div class="crumb"><a href="#/">场景全景</a> / '+h(s.l1_name)+' / '+h(s.l2_name)+' / <b>'+h(s.id)+'</b></div>';
  html+='<div class="shero"><div class="row1"><span class="sid">'+h(s.id)+'</span>'+risk(s.risk)+'</div>'+
    '<h1>'+h(s.title)+'</h1>'+
    '<div class="meta">所属：<b>'+h(s.l1_id+' '+s.l1_name)+'</b> ／ <b>'+h(s.l2_id+' '+s.l2_name)+'</b>'+
    '　·　要素 '+els.length+' 条　·　ODD 引用 '+odds.length+' 条　·　越界响应 '+rps.length+' 条</div></div>';

  /* ① 本体 */
  html+='<div class="card"><h2><span class="num">1</span>场景本体</h2><div class="card-b">'+
    '<dl class="kv">'+
    '<dt>场景描述</dt><dd>'+h(s.summary)+'</dd>'+
    '<dt>作战职能</dt><dd>'+h(s.functions||'—')+'</dd>'+
    '<dt>验证方式</dt><dd>'+h(s.verify||'—')+'</dd>'+
    '<dt>ODD 条目</dt><dd>'+(s.odd_refs.length?s.odd_refs.map(oddLink).join(''):'<span style="color:var(--red)">未引用</span>')+
      (s.odd_ref_text?'<div class="mono" style="font-size:11.5px;color:var(--faint);margin-top:4px">原表引用：'+h(s.odd_ref_text)+'</div>':'')+'</dd>'+
    '<dt>补充条件</dt><dd>'+h(s.odd_note||'—')+'</dd>'+
    '</dl></div></div>';

  /* ② 场景要素 */
  html+='<div class="card"><h2><span class="num">2</span>场景要素（'+els.length+' 条，按 E1–E8 分组）</h2><div class="card-b">';
  if(!els.length){
    html+='<div class="empty">本场景在 03 表中未登记细分要素，判定条件见上方 ODD 条目。</div>';
  }else{
    // 按 E1→E8 类别序分组，同组内按编号升序（03 表里 E7 行是插入的，原顺序不保证）
    els=els.slice().sort(function(a,b){
      return a.category<b.category?-1:a.category>b.category?1:(a.id<b.id?-1:1);
    });
    grp(els,'category').forEach(function(g){
      html+='<h3 style="font-size:13px;margin:10px 0 6px;color:var(--cy);padding-left:8px;border-left:3px solid var(--cy)">'+
        h(g.key)+' <span style="font-weight:400;color:var(--faint);font-size:11.5px">（'+g.items.length+' 条）</span></h3>';
      html+='<div class="tbl-wrap"><table class="tbl"><thead><tr>'+
        '<th class="idc">编号</th><th>要素名称</th><th>本场景取值</th><th>判据</th><th>影响功能</th><th>依据</th></tr></thead><tbody>';
      g.items.forEach(function(e){
        var cls=(hl&&hl===e.id)?' class="hl"':'';
        html+='<tr'+cls+' data-el="'+e.id+'"><td class="idc">'+h(e.id)+'</td><td>'+h(e.name)+'</td>'+
          '<td class="tc">'+h(e.value)+'</td><td class="tc">'+h(e.criterion)+'</td>'+
          '<td class="tc">'+h(e.affected)+'</td><td class="tc" style="font-size:11px">'+h(e.basis)+'</td></tr>';
      });
      html+='</tbody></table></div>';
    });
  }
  html+='</div></div>';

  /* ③ 关联 ODD */
  html+='<div class="card"><h2><span class="num">3</span>关联 ODD 条目（'+odds.length+' 条）</h2><div class="card-b">';
  if(!odds.length) html+='<div class="empty">本场景未引用 04 运行设计范围条目。</div>';
  else{
    html+='<div class="olist">';
    odds.forEach(function(o){
      html+='<div class="ocard"><div class="ochd"><span class="oid">'+h(o.id)+'</span>'+
        '<span class="onm">'+h(o.name)+'</span>'+vd(o.verdict)+
        '<span class="od3">'+h(o.d3)+'</span></div><div class="obd">'+
        '<dt>属性/参数</dt><dd>'+h(o.attr)+'</dd>'+
        '<dt>设定条件</dt><dd>'+h(o.setting)+axis(o.setting)+'</dd>'+
        '<dt>依据</dt><dd style="font-size:11.5px">'+h(o.basis)+'</dd></div></div>';
    });
    html+='</div>';
  }
  html+='</div></div>';

  /* ④ 越界响应 */
  html+='<div class="card"><h2><span class="num">4</span>可能触发的越界与降级响应（'+rps.length+' 条）</h2><div class="card-b">';
  if(!rps.length){
    html+='<div class="empty">本场景在 ODD 设定范围内属<b>正常态运行</b>，未映射到 08 表的强制越界处置条目。'+
      '风险主要来自 ODD 边界被突破时（环境突变、对抗升级），此时由相邻场景的处置条目承接。</div>';
  }else{
    html+='<div class="tbl-wrap"><table class="tbl"><thead><tr>'+
      '<th class="idc">编号</th><th>类别</th><th>监测项</th><th>触发阈值</th><th>响应等级</th><th>处置动作</th><th>关联依据</th></tr></thead><tbody>';
    rps.forEach(function(r){
      var why=(s.response_why[r.id]||[]).map(function(w){

        '<td class="tc">'+h(r.action)+'</td><td class="tc" style="font-size:11px">'+h(why)+'</td></tr>';
    });
    html+='</tbody></table></div>';
    html+='<p class="lead" style="margin:10px 0 0;font-size:11.5px">说明：关联依据来自 02 表 ODD 引用列与场景描述文本的语义匹配；'+
      '<a href="#/degrade">进入越界与降级页</a>查看完整 30 条响应及其监测阈值。</p>';

  html+='</div></div>';

  /* 同 L2 兄弟场景 */
  var sib=D.scenarios.filter(function(x){return x.l2_id===s.l2_id && x.id!==s.id});
  if(sib.length){
    html+='<div class="card"><h2>同一任务剖面下的其他场景（'+h(s.l2_id+' '+s.l2_name)+'）</h2><div class="card-b"><div class="chips">';
    sib.forEach(function(x){html+=scLink(x.id,{title:true})});
    html+='</div></div></div>';
  }
  return html;
}

/* ========== V3 ODD 查询 ========== */
var oddState={d3:null,verdict:null,sel:null};

function oddTree(curD3){

    '<dt>设定条件</dt><dd>'+h(o.setting)+axis(o.setting)+'</dd>'+

    '<dt>正向引用</dt><dd>'+(refs.length?('<div class="reflist">'+refs.map(function(x){return scLink(x)}).join('')+'</div>'):'<span style="color:var(--faint)">暂无场景引用（本条目作为储备/对照项）</span>')+'</dd>'+
    '<dt>依据</dt><dd style="font-size:11.5px">'+h(o.basis)+'</dd>'+
    '</div></div>';

function viewOdd(target){
  var items=D.odd_items, curD3=null, curD2=null, selItem=null;
  if(target){
    if(/^4-\d{3}$/.test(target)){
      selItem=ODD[target];
      if(selItem){ curD3=selItem.d3_code; curD2=selItem.d2_code; }
    }else if(/^\d\.\d\.\d$/.test(target)){ curD3=target; curD2=target.slice(0,3); }
    else if(/^\d\.\d$/.test(target)){ curD2=target; }
    else curD3=target;
  }
  oddState.d3=curD3; oddState.d2=curD2; oddState.sel=selItem?selItem.id:null;

  var html='<div class="page-h"><h1>ODD 运行设计范围查询（04 表 · 110 条）</h1>'+
    '<p>左侧按「二级域 → 三级子域」浏览，右侧列出条目。判定色：'+
    '<span class="badge b-ok">允许</span> <span class="badge b-lim">限制</span> '+
    '<span class="badge b-no">禁止</span> <span class="badge b-mix">混合（分段判定）</span>。'+
    '条目标题可按编号直接访问，如 <code>#/odd/4-095</code>。</p></div>';

  html+='<div class="oddwrap"><aside class="oddtree" id="oddtree">'+oddTree(curD3)+'</aside><div class="oddmain">';

  var vf=oddState.verdict;
  var list=items.filter(function(o){
    if(selItem) return o.id===selItem.id;
    if(curD3 && o.d3_code!==curD3) return false;
    if(curD2 && o.d2_code!==curD2) return false;
    if(vf && o.verdict!==vf) return false;
    return true;
  });

  html+='<div class="filters">'+
    '<span style="font-size:12px;color:var(--faint);margin-right:4px">判定筛选：</span>'+
    '<button class="fb'+(vf===null?' on':'')+'" data-vf="">全部</button>'+
    '<button class="fb f-ok'+(vf==='允许'?' on':'')+'" data-vf="允许">允许 '+items.filter(function(x){return x.verdict==='允许'}).length+'</button>'+
    '<button class="fb f-lim'+(vf==='限制'?' on':'')+'" data-vf="限制">限制 '+items.filter(function(x){return x.verdict==='限制'}).length+'</button>'+
    '<button class="fb f-no'+(vf==='禁止'?' on':'')+'" data-vf="禁止">禁止 '+items.filter(function(x){return x.verdict==='禁止'}).length+'</button>'+
    '<button class="fb f-mix'+(vf==='混合'?' on':'')+'" data-vf="混合">混合 '+items.filter(function(x){return x.verdict==='混合'}).length+'</button>';
  if(selItem){
    html+='<button class="fb" id="clear-d3" data-go="#/odd/'+h(selItem.d3_code)+'" style="margin-left:auto">查看「'+h(selItem.d3)+'」全部 '+
      items.filter(function(x){return x.d3_code===selItem.d3_code}).length+' 条 →</button>';
  }else if(curD3){
    html+='<button class="fb" id="clear-d3" data-go="#/odd" style="margin-left:auto">清除「'+h(curD3)+'」限定 ✕</button>';
  }else if(curD2){
    html+='<button class="fb" id="clear-d3" data-go="#/odd" style="margin-left:auto">清除「'+h(curD2)+'」限定 ✕</button>';
  }
  html+='<span style="font-size:12px;color:var(--faint);'+(selItem||curD3||curD2?'margin-left:14px':'margin-left:auto')+'">当前显示 <b style="color:var(--cy)">'+list.length+'</b> / '+items.length+' 条</span>'+
    '</div>';

  if(!list.length){
    html+='<div class="empty">没有符合条件的 ODD 条目。</div>';
  }else{
    html+='<div class="olist">';
    list.forEach(function(o){ html+=oddCard(o, selItem&&selItem.id===o.id); });
    html+='</div>';
  }
  html+='</div></div>';
  return html;
}

/* ========== V4 矩阵 ========== */
function viewMatrix(){
  var MX=D.matrix, conds=MX.conditions.map(function(c){return c.key});
  var symb={'●':'allow','◐':'lim','✕':'no','—':'na'};
  var html='<div class="page-h"><h1>外部条件适用性矩阵（07 表 · 19 L2 场景 × 15 条件）</h1>'+
    '<p>行 = L2 作战场景，列 = 外部条件维度。点击任意单元格查看该场景在该条件下的判定、涉及的 L3 场景与对应 ODD 条目。'+
    '本页已针对 A3 横向打印优化（表头逐页重复）。</p></div>';

  html+='<div class="mtxwrap"><table class="mtx"><thead><tr><th class="stk">L2 作战场景</th>';
  conds.forEach(function(c){html+='<th title="'+h(c)+'">'+h(c)+'</th>'});
  html+='</tr></thead><tbody>';
  MX.rows.forEach(function(r){
    html+='<tr data-l2="'+h(r.l2_id)+'"><th class="stk">'+h(r.l2_name)+'<span class="id2">'+h(r.l2_id)+'</span></th>';
    conds.forEach(function(c){
      var v=r.cells[c]||'—', k=symb[v]||'na';
      html+='<td class="mc mc-'+k+'" data-l2="'+h(r.l2_id)+'" data-cond="'+h(c)+'" data-v="'+h(v)+'">'+h(v)+'</td>';
    });
    html+='</tr>';
  });
  html+='<tr class="mtxstat"><th class="stk">统计（允许/限制/禁止）</th>';
  MX.stats.forEach(function(s){html+='<td style="font-family:var(--mono);font-size:10.5px">'+h(s.raw)+'</td>'});
  html+='</tr></tbody></table></div>';

  html+='<div class="legend">'+
    '<span><i style="background:var(--ok-bg)"></i>● 允许（保持标称运行）</span>'+
    '<span><i style="background:var(--lim-bg)"></i>◐ 限制（降级运行，需人工确认或裁剪功能）</span>'+
    '<span><i style="background:var(--no-bg)"></i>✕ 禁止（不得进入，触发 MRC 或任务中止）</span>'+
    '<span><i style="background:var(--na-bg)"></i>— 不适用</span></div>';

  var mm={};MX.mapping.forEach(function(m){mm[m.key]=m});
  var ms={};MX.stats.forEach(function(m){ms[m.key]=m});
  html+='<div class="card mtxdet" id="mtxdet"><h2>单元解读</h2><div class="card-b" id="mtxdet-b">'+
    '<p class="lead">点击上方任意单元格，此处显示该「L2 场景 × 外部条件」的判定、映射到的 ODD 条目与该 L2 下的全部 L3 场景。</p></div></div>';

  html+='<div class="card"><h2>条件维度与 ODD 条目映射（15 条，可校验）</h2><div class="card-b"><div class="tbl-wrap"><table class="tbl">'+
    '<thead><tr><th class="idc">#</th><th>外部条件</th><th>允许</th><th>限制</th><th>禁止</th><th>对应 ODD 条目</th><th>校验状态</th></tr></thead><tbody>';
  conds.forEach(function(c,i){
    var m=mm[c]||{targets:[],note:'',prompt_suggestion:[]};
    var st=ms[c]||{allow:'-',restrict:'-',forbid:'-'};
    var bad=m.targets.filter(function(t){return t.status!=='ok'});
    html+='<tr><td class="idc">'+(i+1)+'</td><td><b>'+h(c)+'</b></td>'+
      '<td class="c">'+h(st.allow)+'</td><td class="c">'+h(st.restrict)+'</td><td class="c">'+h(st.forbid)+'</td>'+
      '<td>'+(m.targets.length?m.targets.map(function(t){
        return '<a class="chip" href="#/odd/'+t.id+'" title="'+h(t.name)+'">'+h(t.id)+' '+h(t.name)+'</a>';
      }).join(''):'<span style="color:var(--red)">未映射</span>')+'</td>'+
      '<td>'+(bad.length?'<span class="badge b-no">'+bad.map(function(t){return h(t.id+':'+t.status)}).join(' ')+'</span>':'<span class="badge b-ok">已核对</span>')+'</td></tr>';
  });
  html+='</tbody></table></div>';
  if(MX.note) html+='<p class="lead" style="margin:10px 0 0;font-size:11.5px">'+h(MX.note)+'</p>';
  html+='</div></div>';
  return html;
}

function matrixDetail(l2,cond,v){
  var r=D.matrix.rows.filter(function(x){return x.l2_id===l2})[0];
  if(!r) return '';
  var m=D.matrix.mapping.filter(function(x){return x.key===cond})[0]||{targets:[],note:''};
  var st=D.matrix.stats.filter(function(x){return x.key===cond})[0]||{raw:'-'};
  var sids=r.scenario_ids||[];
  var k={'●':'allow','◐':'lim','✕':'no','—':'na'}[v]||'na';
  var txt={'●':'允许（保持标称运行）','◐':'限制（降级运行，需人工确认或裁剪功能）','✕':'禁止（不得进入，触发 MRC 或任务中止）','—':'不适用'}[v]||v;
  var html='<div class="shero" style="border-left-color:'+
    ({'allow':'#2E5C2E','lim':'#7A5A05','no':'#8C1F1F','na':'#8C8C8C'}[k])+';padding:12px 16px;margin-bottom:12px">'+
    '<div class="row1"><span class="sid">'+h(r.l2_id)+'</span><span class="badge '+(VD2B[{'allow':'允许','lim':'限制','no':'禁止','na':'混合'}[k]])+'">'+h(v)+' '+h(txt)+'</span></div>'+
    '<h1 style="font-size:16px">'+h(r.l2_name)+'　×　'+h(cond)+'</h1>'+
    '<div class="meta">该条件在全部 19 个 L2 中的分布：允许 '+h(st.allow)+' / 限制 '+h(st.restrict)+' / 禁止 '+h(st.forbid)+'</div></div>';
  html+='<dl class="kv">'+
    '<dt>映射 ODD 条目</dt><dd>'+(m.targets.length?m.targets.map(function(t){
      return '<a class="chip" href="#/odd/'+t.id+'">'+h(t.id)+' '+h(t.name)+'</a>';
    }).join(''):'—')+'</dd>'+
    '<dt>该 L2 下场景</dt><dd>'+(sids.length?sids.map(function(x){return scLink(x)}).join(''):'—')+'</dd>'+
    (m.note?'<dt>说明</dt><dd>'+h(m.note)+'</dd>':'')+
    '</dl>';
  return html;
}

/* ========== V5 越界与降级 ========== */
function viewDegrade(focus){
  var DR=D.domain_resp_map;
  // 支持 #/degrade/3.1（状态域）与 #/degrade/4.1（人员类别）的域级聚焦
  var fd=(focus&&/^\d\.\d$/.test(focus))?focus:null;
  var curTitle=null;
  if(fd){
    var s0=D.states.filter(function(s){return s.domain_code===fd})[0];
    var h0=D.humans.filter(function(x){return x.category_code===fd})[0];
    curTitle=s0?s0.domain_name:(h0?h0.category_name:'');
  }
  var html='<div class="page-h"><h1>越界与降级响应（05 系统状态 · 06 人员状态 · 08 降级响应）</h1>'+
    '<p>左侧为运行过程中的四个模式层级，平台在任一监测项越界后按 08 表逐级降级，直至最小风险状态（MRC）。'+
    '3.5 自主与权限状态是安全链路的关键环节（开火权限 / 权限持有者 / 接管就绪度），单独高亮。</p></div>';

  if(fd){
    html+='<div class="filters"><span style="font-size:12px;color:var(--faint)">当前限定：</span>'+
      '<span class="chip on">'+h(fd)+' '+h(curTitle)+'</span>'+
      '<button class="fb" id="clear-fd" data-go="#/degrade" style="margin-left:auto">清除限定 ✕</button></div>';
  }

  html+='<div class="flow">'+
    '<div class="fnode n1"><div class="fn">MODE 0</div><div class="ftt">标称 NOMINAL</div><div class="fd">全部 ODD 条件满足，按任务规划全自主执行</div></div>'+
    '<div class="fnode n2"><div class="fn">MODE 1</div><div class="ftt">受限 RESTRICTED</div><div class="fd">单项条件进入「限制」区，降速/裁剪功能/提高人工确认频率</div></div>'+
    '<div class="fnode n3"><div class="fn">MODE 2</div><div class="ftt">降级 DEGRADED</div><div class="fd">关键能力受损（导航/感知/链路），自主等级下调，任务范围收缩</div></div>'+
    '<div class="fnode n4"><div class="fn">MODE 3</div><div class="ftt">MRC 最小风险</div><div class="fd">就近安全停靠、断火、上报坐标，等待人工介入或拖救</div></div>'+
    '<div class="fnode n5"><div class="fn">MODE 4</div><div class="ftt">中止 ABORT</div><div class="fd">任务终止，按预案返航或原地待援，进入事故/事件记录流程</div></div>'+
    '</div>';

  /* 3.5 安全链 */
  var crit=D.states.filter(function(s){return s.domain_code==='3.5'});
  var critH=D.humans.filter(function(x){return x.critical==='True' || x.category_code==='4.1'});
  html+='<div class="card crit"><h2><span class="num">!</span>安全链路：自主与权限状态（3.5）+ 己方操作与指挥人员（4.1）'+
    '<span class="sub">开火权限 / 权限持有者 / 接管就绪度 —— 任一失效即锁死武器释放</span></h2><div class="card-b">';
  html+='<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="idc">编号</th><th>状态项</th><th>取值域</th><th>判据 / 阈值</th><th>说明</th><th>关联响应</th></tr></thead><tbody>';
  crit.forEach(function(s){
    html+='<tr><td class="idc">'+h(s.id)+'</td><td><b>'+h(s.item)+'</b></td><td class="tc">'+h(s.range)+'</td>'+
      '<td class="tc">'+h(s.criterion)+'</td><td class="tc" style="font-size:11.5px">'+h(s.note)+'</td>'+
      '<td>'+(s.related_responses||[]).map(rpLink).join('')+'</td></tr>';
  });
  critH.forEach(function(x){
    html+='<tr><td class="idc">'+h(x.id)+'</td><td><b>6 表 · '+h(x.item)+'</b></td><td class="tc">'+h(x.value)+'</td>'+
      '<td class="tc">'+h(x.criterion)+'</td><td class="tc" style="font-size:11.5px">'+h(x.note)+'</td><td>—</td></tr>';
  });
  html+='</tbody></table></div></div></div>';

  /* 32 状态按域 */
  if(!fd || fd.charAt(0)==='3'){
  html+='<div class="card"><h2><span class="num">5</span>系统状态清单（05 表 · '+D.states.length+' 条）'+
    '<span class="sub">按 3.1–3.7 七个状态域分组，每条状态映射到 08 表的响应条目</span></h2><div class="card-b">';
  grp(D.states,'domain_code').forEach(function(g){
    if(fd && g.key!==fd) return;
    var dom=g.items[0];
    html+='<div class="domain"><div class="domhd"><span class="dc">'+h(dom.domain_code)+'</span>'+h(dom.domain_name)+
      '<span class="dn">'+g.items.length+' 条 · 关联响应类别：'+(DR[dom.domain]||[]).join(' / ')+'</span></div>'+
      '<div class="tbl-wrap" style="border-radius:0 0 8px 8px"><table class="tbl"><thead><tr>'+
      '<th class="idc">编号</th><th>状态项</th><th>取值域</th><th>判据 / 阈值</th><th>关联响应</th><th>备注</th></tr></thead><tbody>';
    g.items.forEach(function(s){
      var hl=(focus&&focus===s.id)?' class="hl"':'';
      html+='<tr'+hl+'><td class="idc">'+h(s.id)+'</td><td>'+h(s.item)+(s.critical==='True'?' <span class="badge b-no">关键</span>':'')+'</td>'+
        '<td class="tc">'+h(s.range)+'</td><td class="tc">'+h(s.criterion)+'</td>'+
        '<td>'+(s.related_responses||[]).map(rpLink).join('')+'</td>'+
        '<td class="tc" style="font-size:11.5px">'+h(s.note)+'</td></tr>';
    });
    html+='</tbody></table></div></div>';
  });
  html+='</div></div>';
  }

  /* 19 人员状态 */
  if(!fd || fd.charAt(0)==='4'){
  html+='<div class="card"><h2><span class="num">6</span>人员状态与交互条件（06 表 · '+D.humans.length+' 条）'+
    '<span class="sub">按人员类别 4.1–4.5 分组</span></h2><div class="card-b">';
  grp(D.humans,'category_code').forEach(function(g){
    if(fd && g.key!==fd) return;
    var c=g.items[0];
    html+='<h3 style="font-size:13px;margin:10px 0 6px;color:var(--cy);padding-left:8px;border-left:3px solid var(--cy)">'+
      h(c.category)+' <span style="font-weight:400;color:var(--faint);font-size:11.5px">（'+g.items.length+' 条）</span></h3>';
    html+='<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="idc">编号</th><th>状态项</th><th>取值</th><th>判据</th><th>备注</th><th>开火逻辑关联</th></tr></thead><tbody>';
    g.items.forEach(function(x){
      var fireRel=(x.category_code==='4.4')
        ? '<a class="chip" href="#/degrade/8-021" title="8-021 平民进入射击扇区（等级 III，锁死击发）">8-021 锁死击发</a>'
        : '—';
      html+='<tr><td class="idc">'+h(x.id)+'</td><td>'+h(x.item)+'</td><td class="tc">'+h(x.value)+'</td>'+
        '<td class="tc">'+h(x.criterion)+'</td><td class="tc" style="font-size:11.5px">'+h(x.note)+'</td>'+
        '<td class="tc">'+fireRel+'</td></tr>';
    });
    html+='</tbody></table></div>';
  });
  html+='</div></div>';
  }

  /* 30 响应 */
  html+='<div class="card"><h2><span class="num">8</span>越界监测与降级响应（08 表 · '+D.responses.length+' 条）'+
    '<span class="sub">等级 I '+D.responses.filter(function(r){return r.level==='I'}).length+
    ' / II '+D.responses.filter(function(r){return r.level==='II'}).length+
    ' / III '+D.responses.filter(function(r){return r.level==='III'}).length+'（III 为最高风险，直接进入 MRC）</span></h2><div class="card-b">';
  grp(D.responses,'category').forEach(function(g){
    html+='<h3 style="font-size:13px;margin:10px 0 6px;color:var(--cy);padding-left:8px;border-left:3px solid var(--cy)">'+
      h(g.key)+' <span style="font-weight:400;color:var(--faint);font-size:11.5px">（'+g.items.length+' 条）</span></h3>';
    html+='<div class="tbl-wrap"><table class="tbl"><thead><tr>'+
      '<th class="idc">编号</th><th>监测项</th><th>监测源</th><th>触发阈值</th><th>等级</th><th>处置动作</th><th>响应时间</th><th>恢复条件</th><th>涉及场景</th></tr></thead><tbody>';
    g.items.forEach(function(r){
      var hl=(focus&&focus===r.id)?' class="hl"':'';
      html+='<tr'+hl+' id="resp-'+r.id+'"><td class="idc">'+h(r.id)+'</td><td><b>'+h(r.monitor)+'</b></td>'+
        '<td class="tc">'+h(r.source)+'</td><td class="tc">'+h(r.threshold)+'</td><td>'+lv(r.level)+'</td>'+
        '<td class="tc">'+h(r.action)+'</td><td class="tc" style="white-space:nowrap">'+h(r.t_response)+'</td>'+
        '<td class="tc" style="font-size:11px">'+h(r.recover)+'</td>'+
        '<td>'+(r.scenario_ids||[]).map(function(x){return scLink(x)}).join('')+
        (r.id==='8-021'?'<a class="chip" href="#/degrade/4.4" title="4.4 平民与非战斗人员（06 表）">→ 4.4 人员类别</a>':'')+
        '</td></tr>';
    });
    html+='</tbody></table></div>';
  });
  html+='</div></div>';
  return html;
}

/* ========== V6 标准溯源 ========== */
function viewStd(){
  var LNK={'odd':'text-decoration:none'};
  var html='<div class="page-h"><h1>标准要素映射与溯源（09 表 · 23 条）</h1>'+
    '<p>本表将外部参考（智能网联汽车 ODD 五级要素表范式）逐项映射到本文件的 ODD 条目与场景要素，'+
    '用于说明「哪些沿用、哪些改写、哪些新增」。可解析的引用已生成跳转链接，无法解析的保留原文。</p></div>';
  html+='<div class="card"><h2>映射明细</h2><div class="card-b"><div class="tbl-wrap"><table class="tbl">'+
    '<thead><tr><th class="idc">#</th><th>参考表要素（外部）</th><th>处理方式</th><th>本文件对应</th><th>可跳转链接</th><th>说明</th></tr></thead><tbody>';
  D.std_mapping.forEach(function(m){
    html+='<tr><td class="idc">'+h(m.no)+'</td><td><b>'+h(m.ref)+'</b></td><td class="tc">'+h(m.handling)+'</td>'+
      '<td class="tc">'+h(m.ours_raw)+'</td><td>';
    if(m.links&&m.links.length){
      var seen={};
      m.links.forEach(function(l){
        var key=l.type+':'+l.id;
        if(seen[key])return;seen[key]=1;
        if(l.type==='odd' && ODD[l.id]){
          html+='<a class="chip" href="#/odd/'+l.id+'">'+h(l.id)+' '+h(ODD[l.id].name)+'</a>';
        }else if(l.type==='d3'){
          html+='<a class="chip" href="#/odd/'+l.id+'">'+h(l.code||l.id)+'</a>';
        }else if(l.type==='d2'){
          html+='<a class="chip" href="#/odd/'+h(l.id)+'">'+h(l.id)+' '+h(l.label||'')+'</a>';
        }else if(l.type==='human_cat'||l.type==='state_domain'){
          html+='<a class="chip" href="#/degrade/'+h(l.id)+'">'+h(l.id)+' '+h(l.label||'')+'</a>';
        }else if(l.type==='scenario'){
          html+=scLink(l.id,{full:true});
        }else{
          html+='<span class="chip">'+h(l.id)+'</span>';
        }
      });
    }else{html+='<span style="color:var(--faint)">—</span>'}
    html+='</td><td class="tc" style="font-size:11.5px">'+h(m.note)+'</td></tr>';
  });
  html+='</tbody></table></div></div></div>';

  html+='<div class="card"><h2>PEGASUS 六层结构对照（01 表）</h2><div class="card-b"><div class="tbl-wrap"><table class="tbl">'+
    '<thead><tr><th class="idc">#</th><th>外部层级</th><th>本文件类别</th><th>涵盖要素</th><th>改编说明</th></tr></thead><tbody>';
  D.pegasus.forEach(function(p){
    html+='<tr><td class="idc">'+h(p.no)+'</td><td><b>'+h(p.layer)+'</b></td><td class="tc">'+h(p.our_category)+'</td>'+
      '<td class="tc">'+h(p.items)+'</td><td class="tc" style="font-size:11.5px">'+h(p.note)+'</td></tr>';
  });
  html+='</tbody></table></div></div></div>';
  return html;
}

/* ========== 路由 ========== */
function parseHash(){
  var raw=location.hash.replace(/^#/,'')||'/';
  var parts=raw.split('/').filter(function(x){return x!==''});
  return {p:parts};
}

function render(){
  var r=parseHash(), app=document.getElementById('app'), html='', navKey='home';
  var p=r.p;
  if(!p.length||p[0]===''||p[0]==='home'){
    html=viewHome(); navKey='home';
  }else if(p[0]==='scenario' && p[1]){
    html=viewScenario(p[1],p[2]||null); navKey='home';
  }else if(p[0]==='odd'){
    html=viewOdd(p[1]||null); navKey='odd';
  }else if(p[0]==='matrix'){
    html=viewMatrix(); navKey='matrix';
  }else if(p[0]==='degrade'){
    html=viewDegrade(p[1]||null); navKey='degrade';
  }else if(p[0]==='std'){
    html=viewStd(); navKey='std';
  }else if(p[0]==='about'){
    html=viewAbout(); navKey='about';
  }else{
    html='<div class="empty">页面不存在：<code>'+h(location.hash)+'</code>　<a href="#/">返回场景全景</a></div>';
  }
  app.innerHTML=html;
  markTerms(app);
  // nav 高亮
  var links=document.querySelectorAll('#nav a');
  for(var i=0;i<links.length;i++){
    var href=links[i].getAttribute('href').replace('#/','');
    links[i].className=(href===navKey||(navKey==='home'&&href===''))?'on':'';
  }
  window.scrollTo(0,0);
  bindPage();
}

function bindPage(){
  var app=document.getElementById('app');
  var bp=document.getElementById('btn-print');
  if(bp) bp.addEventListener('click',function(){window.print();});
  // ODD 树
  var tree=document.getElementById('oddtree');
  if(tree){
    // 当前条目所在三级在树内居中（仅滚动树容器，不移动页面）
    var on=tree.querySelector('.d3i.on');
    if(on){
      var r=on.getBoundingClientRect(), tr=tree.getBoundingClientRect();
      if(r.top<tr.top+40||r.bottom>tr.bottom-20){
        tree.scrollTop += (r.top-tr.top) - tr.height/2 + r.height;
      }
    }
    tree.addEventListener('click',function(ev){
      var t=ev.target;
      while(t&&t!==tree&&!t.getAttribute('data-d3')) t=t.parentNode;
      if(t&&t!==tree&&t.getAttribute('data-d3')){
        var code=t.getAttribute('data-d3');
        oddState.verdict=null;
        location.hash='#/odd/'+code;
      }
    });
  }
  // 判定筛选
  app.querySelectorAll('.fb[data-vf]').forEach(function(b){
    b.addEventListener('click',function(){
      oddState.verdict=b.getAttribute('data-vf')||null;
      var appEl=document.getElementById('app');
      appEl.innerHTML=viewOdd(oddState.d3||oddState.d2||null);
      bindPage();
    });
  });
  var cd=document.getElementById('clear-d3');
  if(cd) cd.addEventListener('click',function(){
    oddState.verdict=null;
    location.hash=cd.getAttribute('data-go')||'#/odd';
  });
  var cf=document.getElementById('clear-fd');
  if(cf) cf.addEventListener('click',function(){
    location.hash=cf.getAttribute('data-go')||'#/degrade';
  });

  // 矩阵单元格
  app.querySelectorAll('.mtx td.mc').forEach(function(td){
    td.addEventListener('click',function(){
      var l2=td.getAttribute('data-l2'), cond=td.getAttribute('data-cond'), v=td.getAttribute('data-v');
      var box=document.getElementById('mtxdet-b');
      if(box){ box.innerHTML=matrixDetail(l2,cond,v); }
      document.getElementById('mtxdet').scrollIntoView({behavior:'smooth',block:'nearest'});
    });
  });
  // 高亮滚动
  var hl=app.querySelector('.hl');
  if(hl) setTimeout(function(){hl.scrollIntoView({behavior:'smooth',block:'center'})},60);
}

/* ========== 全局搜索 ========== */
var IDX=[];
function buildIndex(){
  D.scenarios.forEach(function(s){IDX.push({g:'场景 S-xx',id:s.id,kw:(s.id+' '+s.title+' '+s.summary+' '+s.functions+' '+s.l1_name+' '+s.l2_name).toLowerCase(),t:s.title,sub:s.title+'　·　风险 '+s.risk,href:'#/scenario/'+s.id})});
  D.elements.forEach(function(e){IDX.push({g:'场景要素 E-xxx',id:e.id,kw:(e.id+' '+e.name+' '+e.value+' '+e.criterion).toLowerCase(),t:e.name+'（'+e.value+'）',sub:e.name+'　·　'+e.value+'　·　场景 '+e.scenario_id,href:'#/scenario/'+e.scenario_id+'/'+e.id})});
  D.odd_items.forEach(function(o){IDX.push({g:'ODD 条目 4-xxx',id:o.id,kw:(o.id+' '+o.name+' '+o.attr+' '+o.setting+' '+o.d3).toLowerCase(),t:o.name,
    sub:o.name+'　·　'+o.d3+'　·　'+((o.ref_scenarios||[]).length?('被 '+o.ref_scenarios.length+' 个场景引用（'+o.ref_scenarios.slice(0,4).join(' ')+(o.ref_scenarios.length>4?' …':'')+'）'):'暂无场景引用'),href:'#/odd/'+o.id})});
  D.states.forEach(function(s){IDX.push({g:'系统状态 5-xxx',id:s.id,kw:(s.id+' '+s.item+' '+s.range+' '+s.criterion+' '+s.domain_name).toLowerCase(),t:s.item+'（'+s.domain_name+'）',sub:s.item+'　·　'+s.domain_name+'　·　'+s.range,href:'#/degrade/'+s.id})});
  D.humans.forEach(function(x){IDX.push({g:'人员状态 6-xxx',id:x.id,kw:(x.id+' '+x.item+' '+x.value+' '+x.criterion).toLowerCase(),t:x.item,sub:x.item+'　·　'+x.category_name,href:'#/degrade/'+x.id})});
  D.responses.forEach(function(r){IDX.push({g:'越界响应 8-xxx',id:r.id,kw:(r.id+' '+r.monitor+' '+r.threshold+' '+r.action+' '+r.category).toLowerCase(),t:r.monitor,sub:r.monitor+'　·　等级 '+r.level+'　·　'+r.threshold+'　·　涉及 '+((r.scenario_ids||[]).length)+' 个场景',href:'#/degrade/'+r.id})});
  D.std_mapping.forEach(function(m){IDX.push({g:'标准映射',id:'#'+m.no,kw:(m.ref+' '+m.ours_raw+' '+m.handling).toLowerCase(),t:m.ref,sub:m.ref,href:'#/std'})});
}
function search(q){
  q=q.trim().toLowerCase();
  if(!q) return [];
  var qs=q.split(/\s+/);
  var res=IDX.filter(function(x){return qs.every(function(k){return x.kw.indexOf(k)>=0})});
  // 精确编号优先
  res.sort(function(a,b){
    var ax=a.id.toLowerCase()===q?0:(a.id.toLowerCase().indexOf(q)===0?1:2);
    var bx=b.id.toLowerCase()===q?0:(b.id.toLowerCase().indexOf(q)===0?1:2);
    return ax-bx;
  });
  return res.slice(0,40);
}

function setupSearch(){
  var inp=document.getElementById('q'), box=document.getElementById('qres');
  var sel=-1, list=[];
  function draw(){
    if(!list.length){box.className='qres';box.innerHTML='<div class="qnone">无匹配结果</div>';return;}
    var last='';
    box.className='qres';
    box.innerHTML=list.map(function(x,i){
      var s='';
      if(x.g!==last){s='<div class="qg">'+h(x.g)+'</div>';last=x.g;}
      return s+'<div class="qi'+(i===sel?' on':'')+'" data-i="'+i+'">'+
        '<div class="qit"><b>'+h(x.id)+'</b><span>'+h(x.t)+'</span></div>'+
        (x.sub&&x.sub!==x.t?'<div class="qis">'+h(x.sub)+'</div>':'')+'</div>';
    }).join('');
  }
  inp.addEventListener('input',function(){
    list=search(inp.value);sel=-1;draw();
    if(!inp.value.trim())box.className='qres hidden';
  });
  inp.addEventListener('focus',function(){if(inp.value.trim()){list=search(inp.value);draw();}});
  box.addEventListener('mousedown',function(ev){
    var t=ev.target;
    while(t&&t!==box&&!t.getAttribute('data-i'))t=t.parentNode;
    if(t&&t!==box){
      var i=+t.getAttribute('data-i');
      if(list[i]){location.hash=list[i].href;box.className='qres hidden';inp.value='';inp.blur();}
    }
  });
  inp.addEventListener('keydown',function(ev){
    if(ev.key==='Escape'){box.className='qres hidden';inp.blur();return;}
    if(!list.length)return;
    if(ev.key==='ArrowDown'){ev.preventDefault();sel=Math.min(sel+1,list.length-1);draw();}
    else if(ev.key==='ArrowUp'){ev.preventDefault();sel=Math.max(sel-1,0);draw();}
    else if(ev.key==='Enter'){
      ev.preventDefault();
      var pick=list[sel>=0?sel:0];
      if(pick){location.hash=pick.href;box.className='qres hidden';inp.value='';inp.blur();}
    }
  });
  document.addEventListener('click',function(ev){
    if(!box.contains(ev.target)&&ev.target!==inp) box.className='qres hidden';
  });
}

/* ========== 启动 ========== */
function boot(){
  buildIndex();
  setupSearch();
  render();
  window.addEventListener('hashchange',render);
  document.getElementById('ft-l').textContent =
    '共 '+D.scenarios.length+' 条 L3 场景 · '+D.elements.length+' 条场景要素 · '+D.odd_items.length+' 条 ODD 条目 · '+
    D.states.length+' 条系统状态 · '+D.humans.length+' 条人员状态 · '+D.responses.length+' 条越界响应 · '+
    D.std_mapping.length+' 条标准映射　|　'+M.file_no+' · '+M.version+' · '+M.date;
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
else boot();
})();
</script>
